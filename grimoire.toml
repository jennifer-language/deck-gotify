# Grimoire book configuration for the @jennifer/gotify documentation.

[book]
title = "@jennifer/gotify"
description = "Push notifications to a Gotify server"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "carbon"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://jennifer-language.github.io/deck-gotify/"
repoUrl = "https://github.com/jennifer-language/deck-gotify"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/deck-gotify/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
